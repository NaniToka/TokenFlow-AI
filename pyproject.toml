[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
ignore = [
    "E501",   # Line too long
    "B008",   # Do not perform function call in argument defaults (FastAPI Depends)
    "RUF012", # Mutable default value for class attribute
    "B039",   # ContextVar default
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
check_untyped_defs = false
disallow_untyped_defs = false
disable_error_code = ["arg-type", "assignment", "return-value", "union-attr"]
